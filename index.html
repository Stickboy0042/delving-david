        html {
            width: 100%;
            height: 100%;

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            display: grid;
            place-items: center;
            background:
                linear-gradient(135deg, rgba(60, 78, 98, 0.16), transparent 36%),
                radial-gradient(circle at 50% 18%, rgba(255, 236, 160, 0.12), transparent 28%),
                #08090c;
        }

        .gm4html5_div_class {
            position: relative;
            width: clamp(1280px, 94vw, 2560px);
            aspect-ratio: 16 / 9;
            max-height: min(1440px, calc(100vh - 48px));
            box-sizing: content-box;
            padding: clamp(12px, 1.5vw, 28px);
            border: 4px solid #050506;
            background: linear-gradient(135deg, #49515b 0%, #23262d 48%, #15171c 100%);
            box-shadow:
                0 0 0 4px #2f343d,
                0 0 0 8px #0c0d10,
                0 28px 70px rgba(0, 0, 0, 0.62);
            overflow: hidden;
        }

        .gm4html5_div_class::before {
            content: "";
            position: absolute;
            inset: clamp(12px, 1.5vw, 28px);
            z-index: 2;
            pointer-events: none;
            box-shadow:
                inset 0 0 0 3px rgba(255, 244, 184, 0.2),
                inset 0 0 22px rgba(0, 0, 0, 0.32);
        }

        .gm4html5_div_class::after {
            content: "";
            position: absolute;
            inset: clamp(12px, 1.5vw, 28px);
            z-index: 3;
            pointer-events: none;
            opacity: 0.45;
            mix-blend-mode: soft-light;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.045) 0,
                rgba(255, 255, 255, 0.045) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            background: #101820;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-interpolation-mode: nearest-neighbor;
            touch-action: none;
        }

        :-webkit-full-screen #canvas,
        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }
    </style>
